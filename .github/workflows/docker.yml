name: Docker Pipeline

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Generate version tag (commit-based)
      - name: Generate version
        run: |
          VERSION=$(git rev-parse --short HEAD)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # 3. Login to Docker Hub
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
          -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 4. Build Docker Image (multi-stage build handles everything)
      - name: Build Docker Image
        run: |
          docker build \
            --build-arg NEXTAUTH_SECRET="${{ secrets.NEXTAUTH_SECRET }}"
            -t ${{ secrets.DOCKER_USERNAME }}/getlancer:$VERSION \
            -t ${{ secrets.DOCKER_USERNAME }}/getlancer:latest \
            .

      # 5. Push Docker Images
      - name: Push Docker Images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/getlancer:$VERSION
          docker push ${{ secrets.DOCKER_USERNAME }}/getlancer:latest