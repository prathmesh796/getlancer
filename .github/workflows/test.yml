name: Testing CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      # 3. Install dependencies (including dev dependencies for testing)
      - name: Install dependencies
        run: npm install

      # 4. Run unit & integration tests
      - name: Run unit & integration tests
        run: npm run test

      # 5. Run e2e tests
      - name: Run e2e tests
        run: npm run test:e2e